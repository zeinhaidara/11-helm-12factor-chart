{{- if .Values.secrets.enabled }}
# external-secrets.io/v1 is the storage version as of external-secrets
# chart release 2.14.0 - confirm against your operator's installed CRDs
apiVersion: {{ .Values.secrets.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "app.fullname" . }}
  data:
    {{- range .Values.secrets.keys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef }}
    {{- end }}
{{- end }}
