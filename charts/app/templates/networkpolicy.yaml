apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  # egress is left open; this policy only restricts who can reach the app
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.allowedNamespaceLabel.key }}: {{ .Values.networkPolicy.allowedNamespaceLabel.value | quote }}
      ports:
        - port: {{ .Values.port }}
